name: Lint

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Lint changed files
        shell: bash
        run: |
          # The first parent of the checked-out PR merge commit is the base.
          git diff --name-only --no-renames --diff-filter=ACMT -z HEAD^1 HEAD -- > "$RUNNER_TEMP/lint-files"
          xargs -0 -r npm exec -- eslint --no-warn-ignored --max-warnings 0 -- < "$RUNNER_TEMP/lint-files"
