name: Lint

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Lint changed files
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            # The first parent of the checked-out PR merge commit is the base.
            base=HEAD^1
          elif [[ "$BEFORE" != 0000000000000000000000000000000000000000 ]]; then
            base="$BEFORE"
          elif [[ "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]]; then
            base=$(git hash-object -t tree -w --stdin </dev/null)
          else
            base=$(git merge-base "refs/remotes/origin/$DEFAULT_BRANCH" HEAD)
          fi

          git diff --name-only --no-renames --diff-filter=ACMT -z "$base" HEAD -- > "$RUNNER_TEMP/lint-files"
          xargs -0 -r npm exec -- eslint --no-warn-ignored --max-warnings 0 -- < "$RUNNER_TEMP/lint-files"
